apiVersion: apps/v1
kind: Deployment
metadata:
  name: matchmaking-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matchmaking
  template:
    metadata:
      labels:
        app: matchmaking
    spec:
      containers:
        - name: matchmaking
          image: checkm8-matchmaking:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: CLIENTSECRET
              value: 8mekHnlPgwWzyRdBkWjLYAYslok06axV
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: matchmaking
spec:
  type: ClusterIP
  selector:
    app: matchmaking
  ports:
    - port: 8080
      targetPort: 8080
